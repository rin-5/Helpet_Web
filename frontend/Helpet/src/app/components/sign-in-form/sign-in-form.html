<div class="login-page">
  <h1>Sign in</h1>
  <form class="login-form" [formGroup]="userAuthLoginForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="login-full-width">
      <mat-label>Username</mat-label>
      <input id="username" formControlName="username" type="text" matInput placeholder="Type in your username">
    </mat-form-field>
    <br>
    <mat-form-field class="login-full-width">
      <mat-label>Enter your password</mat-label>
      <input matInput [type]="hide() ? 'password' : 'text'" />
      <button
        matIconButton
        matSuffix
        (click)="clickEvent($event)"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()">
        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
    </mat-form-field><br/>
    <a routerLink="/sign-up">Don't have an account? Register here!</a>
    <button type="submit" mat-raised-button>Submit</button>
  </form>
</div>
