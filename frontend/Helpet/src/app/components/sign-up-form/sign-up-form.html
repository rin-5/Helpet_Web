<div class="register-page">
  <h1>Sign in</h1>
  <form class="register-form" [formGroup]="userAuthRegisterForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="register-full-width">
      <mat-label>Username</mat-label>
      <input id="username" formControlName="username" type="text" matInput placeholder="Type in your username">
    </mat-form-field>
    <mat-form-field class="register-full-width">
      <mat-label>E-Mail Address</mat-label>
      <input id="email" formControlName="email" type="email" matInput placeholder="Type in your e-mail address..">
    </mat-form-field>
    <mat-form-field class="register-full-width">
      <mat-label>Full Name</mat-label>
      <input id="full-name" formControlName="fullname" type="text" matInput placeholder="Type in your full name.">
    </mat-form-field>

    <br>
    <mat-form-field class="register-full-width">
      <mat-label>Enter your password</mat-label>
      <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" />
      <button
        matIconButton
        matSuffix
        (click)="clickEvent($event)"
        [attr.aria-label]="'Hide password'"
        [attr.aria-pressed]="hide()"
      >
        <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
    </mat-form-field>

    <br>
    <button type="submit" mat-raised-button>Submit</button>
    <br><br>
    <a routerLink="/sign-in">Already have an account? Sign in here!</a>
  </form>
</div>
