<div class="article-container">
  @if (article(); as currentArticle) {
    <div class="central-container-article">
      <h1><u>{{ currentArticle.title }}</u></h1>
      <h3>by {{ currentArticle.author }} on {{ currentArticle.category }}</h3>
      <div class="contents">
        <div class="left-side">
          <img [src]="currentArticle.imageUrl" alt="Article image"/>
        </div>
        <div class="right-side">
          <p>{{ currentArticle.text }}</p>
        </div>
      </div>
    </div>
  }
</div>
