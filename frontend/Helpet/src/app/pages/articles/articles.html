<div class="article-container">
  <div class="central-container-articles">
    <h1><u>Articles</u></h1>
    <div class="articles">
      @for (article of mockupArticleData; track article.id) {
        <app-article-card
          [id]="article.id"
          [author]="article.author"
          [title]="article.title"
          [category]="article.category"
          [imageUrl]="article.imageUrl"/>
      }
    </div>
  </div>
</div>
