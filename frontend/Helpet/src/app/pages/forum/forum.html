<div class="forum-container">
  <div class="central-container-forum">
    <h1><u>Forum</u></h1>
    <div class="posts">
      @for (post of mockupPostData; track post.id) {
          <app-forum-card
            [id]="post.id"
            [title]="post.title"
            [author]="post.author"
            [imageUrl]="post.imageUrl"/>
      }
    </div>
  </div>
</div>
